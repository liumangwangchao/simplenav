<div class="index-wrapper">
  <main class="homepage dark-border-color dark-bg">
    <section class="index-section user-select-none dark-bg">
      <aside class="sidebar dark-bg dark-border-color" id="sidebar">
        <div class="site-title">思维导图</div>
        <ul *ngIf="websiteList[page]">
          <li class="tag dark-text" [class.active]="id === i" [class.dark-item-active]="id === i"
            (click)="handleSidebarNav(i)" *ngFor="let item of websiteList[page].nav; index as i">
            <div>{{ item.title }}</div>
          </li>
        </ul>
      </aside>
      <div class="main dark-scrollbar">
        <div *ngIf="currentList.length > 0; else noData">
          <div class="section-block" *ngFor="let item of currentList.slice(0, sliceMax); index as i">
            <app-toolbar-title [dataSource]="item" (onCollapse)="onCollapse(item, i)" [index]="i"></app-toolbar-title>
            <div class="card-grid" [style.display]="item.collapsed ? 'none' : ''">
              <div class="gutter-row" *ngFor="let el of item.nav.slice(0, sliceMax); index as j">
                <app-card cardStyle="example2" [dataSource]="el" [indexs]="[page, id, i, j]"></app-card>
              </div>
            </div>
          </div>
        </div>
        <ng-template #noData><app-no-data></app-no-data></ng-template>
      </div>
    </section>
  </main>
</div>
<div class="layer-bg dark-bg"></div>
